name: M3 CodeQL

on:
  push:
    branches: [main, 'm3/**']
    paths: ['m3/**', '.github/workflows/m3-codeql.yml']
  pull_request:
    paths: ['m3/**', '.github/workflows/m3-codeql.yml']
name: M3 CodeQL evidence

on:
  pull_request:
    paths:
      - "m3/**"
      - ".github/workflows/m3-codeql.yml"
      - "java/ql/lib/**"
      - "shared/**"
  push:
    branches: [main]
    paths:
      - "m3/**"
      - ".github/workflows/m3-codeql.yml"
      - "java/ql/lib/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-and-ql:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: m3/tools/pom.xml
      - name: Check committed M3 diff
        env:
          M3_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$M3_EVENT_BASE"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="2e2b72797673638eaf94772632721d2fa5c42219"
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git diff --check "$base" HEAD -- m3 .github/workflows/m3-codeql.yml
      - name: Compile and test the Java runner
        run: mvn -B -ntp -f m3/tools/pom.xml verify
      - name: Install pinned CodeQL CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/github/codeql-cli-binaries/releases/download/v2.27.4/codeql-linux64.zip \
            --output "$RUNNER_TEMP/codeql-linux64.zip"
          printf '%s  %s\n' '393bf92b66596141ec93baf9b483f4a350f3749916c922fed0dd63c67706047d' "$RUNNER_TEMP/codeql-linux64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/codeql-linux64.zip" -d "$RUNNER_TEMP/codeql-cli"
      - name: Install pinned Windows CodeQL CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codeql-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/github/codeql-cli-binaries/releases/download/v2.27.4/codeql-win64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne 'a7ab5f73a8f440c3269f6660deb1d34f76005e756ccdf58c84c5ff88355453db') {
            throw 'CodeQL archive SHA-256 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'codeql-cli')
      - name: Verify M3 queries with the actual CodeQL CLI
        env:
          M3_CODEQL_EXECUTABLE: ${{ runner.os == 'Windows' && 'codeql.exe' || 'codeql' }}
        run: |
          java -jar m3/tools/target/m3-codeql-tools-0.1.0.jar verify \
            --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/m3-codeql-verification" \
            --codeql "$RUNNER_TEMP/codeql-cli/codeql/$M3_CODEQL_EXECUTABLE" \
            --threads 2 --ram 3072 --timeout-seconds 600 --execute
      - name: Preserve Java and CodeQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-codeql-${{ runner.os }}-${{ github.sha }}
          path: |
            m3/tools/target/surefire-reports/
            ${{ runner.temp }}/m3-codeql-verification/
          if-no-files-found: error
  group: m3-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "m3/**/pom.xml"
      - name: Build and test Java modules
        run: mvn -B -ntp -f m3/pom.xml verify
      - name: Verify recipe snapshot
        run: mvn -B -ntp -f m3/recipes/pom.xml exec:java -Dexec.args="verify $GITHUB_WORKSPACE"
      - name: Install the qualified CodeQL CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-codeql-cli"
          cd "$RUNNER_TEMP/m3-codeql-cli"
          curl --fail --location --retry 3 --output codeql-linux64.zip \
            https://github.com/github/codeql-cli-binaries/releases/download/v2.27.4/codeql-linux64.zip
          echo '393bf92b66596141ec93baf9b483f4a350f3749916c922fed0dd63c67706047d  codeql-linux64.zip' | sha256sum --check
          unzip -q codeql-linux64.zip
          echo "M3_CODEQL=$RUNNER_TEMP/m3-codeql-cli/codeql/codeql" >> "$GITHUB_ENV"
      - name: Check QL formatting
        run: '"$M3_CODEQL" query format --check-only m3/ql/java/*.ql m3/ql/java/*.qll m3/ql/java-tests/evidence/*.ql'
      - name: Run real QL fixture tests
        run: '"$M3_CODEQL" test run --search-path=. --threads=1 --ram=2048 -J-Xmx1400m --fast-compilation --check-databases m3/ql/java-tests'
      - name: Verify fresh extraction and evidence reports
        run: python3 m3/scripts/verify_integration.py --codeql "$M3_CODEQL" --work "$RUNNER_TEMP/m3-codeql-proof"
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-codeql-verification
          if-no-files-found: ignore
          path: |
            m3/runtime/target/surefire-reports/
            m3/recipes/target/surefire-reports/
            ${{ runner.temp }}/m3-codeql-proof/*.json
            ${{ runner.temp }}/m3-codeql-proof/*.log
            ${{ runner.temp }}/m3-codeql-proof/analysis/*.tsv
            ${{ runner.temp }}/m3-codeql-proof/analysis/*.md
            ${{ runner.temp }}/m3-codeql-proof/analysis/logs/
